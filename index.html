<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snipo — Link Shortener</title>
<meta name="description" content="Shrink any link down to size — free, key-free URL shortening with QR codes, tags, and history.">
<meta name="theme-color" content="#10131a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snipo">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --radius:14px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#10131a; --surface:#1a1e27; --surface2:#20242f; --border:#2b303c;
    --text:#eef0f4; --sub:#9199a8; --accent:#d4a24c; --accent-ink:#181205;
    --danger:#e0674f; --good:#5fbf7a; --ring:#d4a24c55;
  }
  html[data-theme="light"]{
    --bg:#f7f5f1; --surface:#ffffff; --surface2:#f1ede5; --border:#e2ddd3;
    --text:#1c1e24; --sub:#6b7280; --accent:#a86f22; --accent-ink:#fff8ec;
    --danger:#b8402b; --good:#2f8f5a; --ring:#a86f2244;
  }
  html[data-theme="oled"]{
    --bg:#000000; --surface:#0a0a0a; --surface2:#121212; --border:#232323;
    --text:#f2f2f2; --sub:#8a8a8a; --accent:#e0ac5a; --accent-ink:#140d00;
    --danger:#ff7a5c; --good:#6fd68a; --ring:#e0ac5a55;
  }
  html[data-theme="hc"]{
    --bg:#000000; --surface:#000000; --surface2:#000000; --border:#ffffff;
    --text:#ffffff; --sub:#ffffff; --accent:#ffd54a; --accent-ink:#000000;
    --danger:#ff6b6b; --good:#7dff9a; --ring:#ffd54a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100dvh; background:var(--bg); color:var(--text);
    font-family:var(--sans); display:flex; flex-direction:column; align-items:center;
    transition:background .2s,color .2s;
  }
  body.no-share .sharebtn{display:none;}
  .wrap{width:100%; max-width:560px; padding:20px 18px 32px; flex:1; display:flex; flex-direction:column;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand svg{flex:none;}
  .brand h1{font-size:1.3rem; margin:0; letter-spacing:.2px;}
  .brand p{margin:1px 0 0; font-size:.75rem; color:var(--sub);}
  .hdr-actions{display:flex; align-items:center; gap:8px;}
  .themes{display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:4px;}
  .themes button{
    width:30px; height:30px; border-radius:999px; border:none; background:transparent;
    color:var(--sub); font-size:.85rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .themes button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink);}
  .themes button:focus-visible{outline:2px solid var(--ring); outline-offset:2px;}
  .gear{
    width:34px; height:34px; border-radius:999px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); cursor:pointer; font-size:.95rem; display:flex; align-items:center; justify-content:center; flex:none;
  }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; margin-bottom:16px;
  }
  label{display:block; font-size:.75rem; color:var(--sub); margin-bottom:6px; text-transform:uppercase; letter-spacing:.06em;}
  .row{display:flex; gap:8px;}
  input[type=url], input[type=search], input[type=text], textarea, select{
    flex:1; min-width:0; background:var(--surface2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:12px 13px; font-size:.95rem; font-family:var(--mono);
  }
  select{font-family:var(--sans); font-size:.82rem;}
  textarea{width:100%; resize:vertical; min-height:96px; line-height:1.5;}
  input:focus-visible, textarea:focus-visible, select:focus-visible{outline:2px solid var(--ring); outline-offset:1px;}
  .opt-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .opt-row > *{flex:1; min-width:130px;}
  .checkline{display:flex; align-items:center; gap:8px; font-size:.8rem; color:var(--text); margin-top:2px;}
  .checkline input{flex:none; width:auto; accent-color:var(--accent);}
  .btn-row{display:flex; gap:8px; margin-top:12px;}
  button.go{
    border:none; background:var(--accent); color:var(--accent-ink); font-weight:700;
    border-radius:10px; padding:0 18px; cursor:pointer; font-size:.95rem; display:flex; align-items:center; gap:6px; flex:1; justify-content:center; height:46px;
  }
  button.go:disabled{opacity:.55; cursor:wait;}
  button.reset{
    border:1px solid var(--border); background:transparent; color:var(--sub);
    border-radius:10px; padding:0 16px; cursor:pointer; font-size:.85rem; height:46px;
  }
  .hint{font-size:.72rem; color:var(--sub); margin-top:8px;}
  .error{color:var(--danger); font-size:.8rem; margin-top:8px; display:none;}

  .tabs{display:flex; gap:6px; margin-bottom:14px;}
  .tabs button{
    flex:1; border:1px solid var(--border); background:var(--surface2); color:var(--sub);
    border-radius:10px; padding:9px; font-size:.82rem; cursor:pointer; font-weight:600;
  }
  .tabs button[aria-selected="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .mode-panel{display:none;}
  .mode-panel.active{display:block;}

  .preview{display:none; align-items:center; gap:9px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:9px 12px; margin-top:10px; font-size:.78rem;}
  .preview.show{display:flex;}
  .preview .pdot{width:6px; height:6px; border-radius:50%; background:var(--accent); flex:none;}
  .preview .ptitle{color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .preview .pdomain{color:var(--sub); flex:none;}
  .dup-banner{display:none; background:var(--surface2); border:1px dashed var(--accent); border-radius:10px; padding:10px 12px; margin-top:10px; font-size:.8rem;}
  .dup-banner.show{display:block;}
  .dup-banner .dactions{display:flex; gap:8px; margin-top:8px;}
  .dup-banner button{
    border:1px solid var(--border); background:transparent; color:var(--text); border-radius:8px;
    padding:7px 11px; font-size:.75rem; cursor:pointer;
  }
  .dup-banner button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  .result{display:none; margin-top:16px; gap:12px; flex-direction:column;}
  .result.show{display:flex;}
  .result-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .chain{flex:none; animation:snap .5s ease;}
  @keyframes snap{0%{transform:scale(.6) rotate(-10deg); opacity:0;}60%{transform:scale(1.08) rotate(4deg);}100%{transform:scale(1) rotate(0);}}
  .short-url{
    flex:1; min-width:120px; background:var(--surface2); border:1px solid var(--border);
    border-radius:10px; padding:11px 13px; font-family:var(--mono); font-size:.95rem;
    overflow-x:auto; white-space:nowrap;
  }
  .copy, .qrbtn, .sharebtn{
    border:1px solid var(--border); background:transparent; color:var(--text);
    border-radius:10px; padding:11px 13px; cursor:pointer; font-size:.85rem; flex:none;
  }
  .copy.copied{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .qrbox{display:none; flex-direction:column; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px;}
  .qrbox.show{display:flex;}
  .qrbox img, .qrbox canvas{border-radius:6px; background:#fff; padding:8px;}
  .qrbox .qrdl{font-size:.75rem; color:var(--accent); background:none; border:none; cursor:pointer; text-decoration:underline;}

  .bulk-results{margin-top:14px; display:flex; flex-direction:column; gap:8px;}
  .bres{display:flex; align-items:center; gap:8px; font-size:.82rem; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 10px;}
  .bres .bshort{font-family:var(--mono); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bres .bstatus{flex:none; font-size:.9rem;}
  .bres.err .bshort{color:var(--danger);}

  .history h2{font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--sub); margin:0 0 12px;}
  .hist-controls{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
  .hist-controls .hcrow{display:flex; gap:8px;}
  .tagchips{display:flex; gap:6px; flex-wrap:wrap;}
  .tagchip{
    border:1px solid var(--border); background:var(--surface2); color:var(--sub);
    border-radius:999px; padding:5px 11px; font-size:.72rem; cursor:pointer;
  }
  .tagchip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .util-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:2px;}
  .util-row button, .util-row label.filebtn{
    border:1px solid var(--border); background:transparent; color:var(--sub);
    border-radius:8px; padding:7px 11px; font-size:.72rem; cursor:pointer;
  }
  input[type=file]{display:none;}

  .hitem{display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-top:1px solid var(--border);}
  .hitem:first-of-type{border-top:none;}
  .healthdot{width:9px; height:9px; border-radius:50%; background:var(--sub); flex:none; margin-top:4px;}
  .healthdot.ok{background:var(--good);}
  .healthdot.dead{background:var(--danger);}
  .hbody{flex:1; min-width:0;}
  .hshortrow{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;}
  .hshort{font-family:var(--mono); font-size:.88rem;}
  .hdomain{font-size:.68rem; color:var(--sub); background:var(--surface2); border-radius:5px; padding:1px 6px;}
  .hlong{font-size:.72rem; color:var(--sub); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px;}
  .hmeta{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;}
  .hexpiry, .hcopies{font-size:.66rem; color:var(--accent);}
  .htagpill{font-size:.66rem; background:var(--surface2); color:var(--sub); border-radius:999px; padding:1px 8px;}
  .hactions{display:flex; gap:6px; flex:none; flex-wrap:wrap; max-width:76px; justify-content:flex-end;}
  .hactions button{
    border:1px solid var(--border); background:transparent; color:var(--sub);
    border-radius:8px; width:28px; height:28px; cursor:pointer; font-size:.8rem;
  }
  .empty{color:var(--sub); font-size:.82rem; text-align:center; padding:14px 0;}
  .clear-all{
    display:block; margin:12px auto 0; background:none; border:none; color:var(--sub);
    font-size:.75rem; cursor:pointer; text-decoration:underline;
  }
  .hist-qr{margin-top:10px;}

  .lockscreen{text-align:center; padding:18px 6px;}
  .lockscreen p{color:var(--sub); font-size:.85rem; margin:6px 0 14px;}
  .pin-row{display:flex; gap:8px; max-width:220px; margin:0 auto;}
  .pin-row input{text-align:center; letter-spacing:.3em;}

  .settings{display:none;}
  .settings.show{display:block;}
  .settings .field{margin-bottom:12px;}
  .lock-row{display:flex; gap:8px; align-items:center;}
  .lock-row input{width:110px;}
  .small-btn{
    border:1px solid var(--border); background:transparent; color:var(--text);
    border-radius:8px; padding:9px 12px; cursor:pointer; font-size:.8rem;
  }
  .lockstate{font-size:.72rem; color:var(--sub); margin-top:6px;}

  footer{
    width:100%; text-align:center; padding:16px 12px 22px; color:var(--sub); font-size:.72rem;
    display:flex; flex-direction:column; align-items:center; gap:2px; border-top:1px solid var(--border);
  }
  a{color:inherit;}
  @media (max-width:380px){
    .row{flex-direction:column;}
    .btn-row{flex-direction:column;}
    button.go, button.reset{padding:12px; justify-content:center;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div><h1>Snipo</h1><p>Shrink any link down to size</p></div>
    </div>
    <div class="hdr-actions">
      <button class="gear" id="gearBtn" title="Settings">⚙</button>
      <div class="themes" id="themes" role="group" aria-label="Theme">
        <button data-t="dark" aria-pressed="true" title="Dark">🌙</button>
        <button data-t="light" title="Light">☀️</button>
        <button data-t="oled" title="OLED True Black">⚫</button>
        <button data-t="hc" title="High Contrast">◐</button>
      </div>
    </div>
  </header>

  <div class="card settings" id="settingsPanel">
    <h2 style="font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin:0 0 12px;">Settings</h2>
    <div class="field">
      <label for="providerSel">Shortener service</label>
      <select id="providerSel">
        <option value="auto">Auto (try all, most reliable)</option>
        <option value="tinyurl">TinyURL only</option>
        <option value="isgd">is.gd only</option>
        <option value="dagd">da.gd only</option>
      </select>
    </div>
    <div class="field">
      <label for="defaultExpiry">Default link expiry (for new links)</label>
      <select id="defaultExpiry">
        <option value="0">Never expires</option>
        <option value="7">7 days</option>
        <option value="30">30 days</option>
        <option value="90">90 days</option>
      </select>
    </div>
    <div class="field checkline">
      <input type="checkbox" id="stripTrackers" checked>
      <label style="margin:0; text-transform:none; letter-spacing:0; font-size:.82rem;" for="stripTrackers">Strip tracking params (utm_*, fbclid, gclid…) before shortening</label>
    </div>
    <div class="field">
      <label>History PIN lock</label>
      <div class="lock-row">
        <input type="text" id="pinInput" inputmode="numeric" maxlength="6" placeholder="4–6 digits">
        <button class="small-btn" id="setPinBtn">Enable lock</button>
        <button class="small-btn" id="removePinBtn" style="display:none;">Remove lock</button>
      </div>
      <p class="lockstate" id="lockState">No lock set — history is visible on this device.</p>
    </div>
  </div>

  <div class="card">
    <div class="tabs" role="tablist">
      <button id="tabSingle" aria-selected="true">Single link</button>
      <button id="tabBulk" aria-selected="false">Bulk shorten</button>
    </div>

    <div class="mode-panel active" id="panelSingle">
      <label for="longUrl">Paste a long URL</label>
      <div class="row">
        <input id="longUrl" type="url" inputmode="url" placeholder="https://example.com/a/very/long/path" autocomplete="off">
      </div>
      <div class="preview" id="preview">
        <span class="pdot"></span>
        <span class="ptitle" id="previewTitle"></span>
        <span class="pdomain" id="previewDomain"></span>
      </div>
      <div class="dup-banner" id="dupBanner">
        Already shortened as <strong id="dupShort"></strong>.
        <div class="dactions">
          <button class="primary" id="dupUse">Use existing</button>
          <button id="dupIgnore">Shorten again</button>
        </div>
      </div>
      <div class="opt-row">
        <input class="alias" id="alias" type="text" placeholder="Custom alias (optional)" maxlength="30">
        <input type="text" id="tagsInput" placeholder="Tags, comma separated">
        <select id="expirySel">
          <option value="0">Never expires</option>
          <option value="7">Expires in 7 days</option>
          <option value="30">Expires in 30 days</option>
          <option value="90">Expires in 90 days</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="go" id="goBtn">Shorten</button>
        <button class="reset" id="resetBtn">Reset</button>
      </div>
      <p class="error" id="err"></p>

      <div class="result" id="result">
        <div class="result-top">
          <svg class="chain" id="chainIcon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round">
            <path d="M9 15l6-6"/><path d="M8 6h4a4 4 0 010 8"/><path d="M16 18h-4a4 4 0 010-8" transform="rotate(180 12 14)"/>
          </svg>
          <span class="short-url" id="shortOut"></span>
          <button class="copy" id="copyBtn">Copy</button>
          <button class="qrbtn" id="qrToggleBtn">QR</button>
          <button class="sharebtn" id="shareBtn">Share</button>
        </div>
        <div class="qrbox" id="qrBox">
          <div id="qrCanvas"></div>
          <button class="qrdl" id="qrDownload">Download PNG</button>
        </div>
      </div>
    </div>

    <div class="mode-panel" id="panelBulk">
      <label for="bulkText">One URL per line</label>
      <textarea id="bulkText" placeholder="https://example.com/one&#10;https://example.com/two&#10;https://example.com/three"></textarea>
      <div class="btn-row">
        <button class="go" id="bulkGoBtn">Shorten all</button>
        <button class="reset" id="bulkResetBtn">Reset</button>
      </div>
      <p class="hint">Blank lines are skipped. Successful links are saved to history automatically.</p>
      <p class="error" id="bulkErr"></p>
      <div class="bulk-results" id="bulkResults"></div>
    </div>
  </div>

  <div class="card history">
    <h2>History</h2>
    <div id="lockScreen" class="lockscreen" style="display:none;">
      <p>🔒 History is locked. Enter your PIN to view it.</p>
      <div class="pin-row">
        <input type="text" id="unlockInput" inputmode="numeric" maxlength="6" placeholder="PIN">
        <button class="small-btn" id="unlockBtn">Unlock</button>
      </div>
    </div>
    <div id="histWrap">
      <div class="hist-controls">
        <div class="hcrow">
          <input type="search" id="histSearch" placeholder="Search history…">
          <select id="histSort" style="max-width:150px;">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="az">Domain A–Z</option>
            <option value="copied">Most copied</option>
          </select>
        </div>
        <div class="tagchips" id="tagChips"></div>
        <div class="util-row">
          <button id="exportJson">Export JSON</button>
          <button id="exportCsv">Export CSV</button>
          <label class="filebtn" for="importFile">Import JSON</label>
          <input type="file" id="importFile" accept="application/json">
          <button id="checkHealth">Check links</button>
        </div>
      </div>
      <div id="histList"></div>
      <button class="clear-all" id="clearAll">Clear all history</button>
    </div>
  </div>
</div>

<footer>
  <span>© Manik Roy <span id="year"></span>. All Rights Reserved.</span>
</footer>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const longUrl = $('#longUrl'), alias = $('#alias'), tagsInput = $('#tagsInput'), expirySel = $('#expirySel'), goBtn = $('#goBtn'), err = $('#err'), resetBtn = $('#resetBtn');
  const result = $('#result'), shortOut = $('#shortOut'), copyBtn = $('#copyBtn'), chainIcon = $('#chainIcon'), shareBtn = $('#shareBtn');
  const qrToggleBtn = $('#qrToggleBtn'), qrBox = $('#qrBox'), qrCanvas = $('#qrCanvas'), qrDownload = $('#qrDownload');
  const histList = $('#histList'), clearAll = $('#clearAll'), histWrap = $('#histWrap');
  const bulkText = $('#bulkText'), bulkGoBtn = $('#bulkGoBtn'), bulkResetBtn = $('#bulkResetBtn'), bulkErr = $('#bulkErr'), bulkResults = $('#bulkResults');
  const gearBtn = $('#gearBtn'), settingsPanel = $('#settingsPanel');
  const providerSel = $('#providerSel'), defaultExpiry = $('#defaultExpiry'), stripTrackers = $('#stripTrackers');
  const pinInput = $('#pinInput'), setPinBtn = $('#setPinBtn'), removePinBtn = $('#removePinBtn'), lockState = $('#lockState');
  const lockScreen = $('#lockScreen'), unlockInput = $('#unlockInput'), unlockBtn = $('#unlockBtn');
  const preview = $('#preview'), previewTitle = $('#previewTitle'), previewDomain = $('#previewDomain');
  const dupBanner = $('#dupBanner'), dupShort = $('#dupShort'), dupUse = $('#dupUse'), dupIgnore = $('#dupIgnore');
  const histSearch = $('#histSearch'), histSort = $('#histSort'), tagChips = $('#tagChips');
  const exportJsonBtn = $('#exportJson'), exportCsvBtn = $('#exportCsv'), importFile = $('#importFile'), checkHealthBtn = $('#checkHealth');

  const THEME_KEY='snipo_theme', HIST_KEY='snipo_history', PROV_KEY='snipo_provider', EXP_KEY='snipo_default_expiry',
        PIN_KEY='snipo_pin', STRIP_KEY='snipo_strip';
  let unlocked = false, activeTag = null, dupTarget = null;
  if(!navigator.share) document.body.classList.add('no-share');

  // ---- Theme ----
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    document.querySelectorAll('#themes button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.t===t ? 'true':'false'));
    localStorage.setItem(THEME_KEY, t);
  }
  $('#themes').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) applyTheme(b.dataset.t); });
  applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
  document.getElementById('year').textContent = new Date().getFullYear();

  // ---- Tabs ----
  $('#tabSingle').addEventListener('click', ()=>switchTab('single'));
  $('#tabBulk').addEventListener('click', ()=>switchTab('bulk'));
  function switchTab(mode){
    $('#tabSingle').setAttribute('aria-selected', mode==='single');
    $('#tabBulk').setAttribute('aria-selected', mode==='bulk');
    $('#panelSingle').classList.toggle('active', mode==='single');
    $('#panelBulk').classList.toggle('active', mode==='bulk');
  }

  // ---- Settings ----
  gearBtn.addEventListener('click', ()=>settingsPanel.classList.toggle('show'));
  providerSel.value = localStorage.getItem(PROV_KEY) || 'auto';
  providerSel.addEventListener('change', ()=>localStorage.setItem(PROV_KEY, providerSel.value));
  defaultExpiry.value = localStorage.getItem(EXP_KEY) || '0';
  defaultExpiry.addEventListener('change', ()=>{
    localStorage.setItem(EXP_KEY, defaultExpiry.value);
    expirySel.value = defaultExpiry.value;
  });
  expirySel.value = defaultExpiry.value;
  stripTrackers.checked = localStorage.getItem(STRIP_KEY) !== '0';
  stripTrackers.addEventListener('change', ()=>localStorage.setItem(STRIP_KEY, stripTrackers.checked ? '1':'0'));

  // ---- PIN lock ----
  function refreshLockUI(){
    const pin = localStorage.getItem(PIN_KEY);
    if(pin){
      lockState.textContent = 'Lock is on — history is hidden until the PIN is entered.';
      setPinBtn.style.display = 'none'; removePinBtn.style.display = 'inline-block';
    } else {
      lockState.textContent = 'No lock set — history is visible on this device.';
      setPinBtn.style.display = 'inline-block'; removePinBtn.style.display = 'none';
    }
  }
  setPinBtn.addEventListener('click', ()=>{
    const v = pinInput.value.trim();
    if(!/^\d{4,6}$/.test(v)){ alert('PIN must be 4–6 digits.'); return; }
    localStorage.setItem(PIN_KEY, v); pinInput.value = ''; unlocked = false;
    refreshLockUI(); renderHistory();
  });
  removePinBtn.addEventListener('click', ()=>{
    localStorage.removeItem(PIN_KEY); unlocked = true;
    refreshLockUI(); renderHistory();
  });
  unlockBtn.addEventListener('click', tryUnlock);
  unlockInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  function tryUnlock(){
    const pin = localStorage.getItem(PIN_KEY);
    if(unlockInput.value.trim() === pin){ unlocked = true; unlockInput.value=''; renderHistory(); }
    else alert('Incorrect PIN.');
  }
  refreshLockUI();

  // ---- URL helpers ----
  const TRACKER_KEYS = /^(utm_|fbclid|gclid|gclsrc|mc_eid|mc_cid|igshid|ref|ref_src|yclid|msclkid|si|spm)/i;
  function stripTrackingParams(urlStr){
    try{
      const u = new URL(urlStr);
      if(!stripTrackers.checked) return u.href;
      [...u.searchParams.keys()].forEach(k=>{ if(TRACKER_KEYS.test(k)) u.searchParams.delete(k); });
      return u.href;
    }catch(e){ return urlStr; }
  }
  function domainOf(urlStr){
    try{ return new URL(urlStr).hostname.replace(/^www\./,''); }catch(e){ return ''; }
  }
  function isValidUrl(v){
    try{ const u = new URL(v); return u.protocol==='http:' || u.protocol==='https:'; }
    catch(e){ return false; }
  }
  function normKey(urlStr){
    try{
      const u = new URL(urlStr);
      return (u.hostname.replace(/^www\./,'') + u.pathname + u.search).replace(/\/$/,'').toLowerCase();
    }catch(e){ return urlStr.toLowerCase(); }
  }

  // ---- History storage ----
  function loadHistory(){
    let list;
    try{ list = JSON.parse(localStorage.getItem(HIST_KEY)) || []; }catch(e){ list = []; }
    const now = Date.now();
    const kept = list.filter(h => !h.expiresAt || h.expiresAt > now);
    if(kept.length !== list.length) saveHistory(kept);
    return kept;
  }
  function saveHistory(list){ localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0,200))); }
  function fmtExpiry(ts){
    const days = Math.ceil((ts - Date.now()) / 86400000);
    return days <= 0 ? 'Expiring soon' : `Expires in ${days}d`;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- Search / sort / tag filter ----
  function getFiltered(){
    let list = loadHistory();
    const q = histSearch.value.trim().toLowerCase();
    if(q){
      list = list.filter(h =>
        h.short.toLowerCase().includes(q) || h.long.toLowerCase().includes(q) ||
        (h.domain||'').toLowerCase().includes(q) || (h.tags||[]).some(t=>t.toLowerCase().includes(q)));
    }
    if(activeTag) list = list.filter(h => (h.tags||[]).includes(activeTag));
    const sort = histSort.value;
    list = list.slice().sort((a,b)=>{
      if(sort==='oldest') return a.ts - b.ts;
      if(sort==='az') return (a.domain||'').localeCompare(b.domain||'');
      if(sort==='copied') return (b.copyCount||0) - (a.copyCount||0);
      return b.ts - a.ts;
    });
    return list;
  }
  histSearch.addEventListener('input', renderHistory);
  histSort.addEventListener('change', renderHistory);

  function renderTagChips(){
    const all = loadHistory();
    const tagset = new Set();
    all.forEach(h => (h.tags||[]).forEach(t=>tagset.add(t)));
    if(!tagset.size){ tagChips.innerHTML = ''; return; }
    const chips = ['<button class="tagchip'+(activeTag?'':' active')+'" data-tag="">All</button>']
      .concat([...tagset].sort().map(t=>`<button class="tagchip${activeTag===t?' active':''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`));
    tagChips.innerHTML = chips.join('');
  }
  tagChips.addEventListener('click', e=>{
    const b = e.target.closest('.tagchip'); if(!b) return;
    activeTag = b.dataset.tag || null;
    renderHistory();
  });

  function renderHistory(){
    const pin = localStorage.getItem(PIN_KEY);
    if(pin && !unlocked){ lockScreen.style.display='block'; histWrap.style.display='none'; return; }
    lockScreen.style.display='none'; histWrap.style.display='block';

    renderTagChips();
    const list = getFiltered();
    if(!list.length){
      histList.innerHTML = '<p class="empty">No links match — try a different search or filter.</p>';
      clearAll.style.display = loadHistory().length ? 'block' : 'none';
      return;
    }
    clearAll.style.display = 'block';
    histList.innerHTML = list.map(h=>{
      const dot = h.health==='ok' ? 'ok' : h.health==='dead' ? 'dead' : '';
      return `
      <div class="hitem" data-id="${h.id}">
        <span class="healthdot ${dot}" title="${h.health==='ok'?'Reachable':h.health==='dead'?'Unreachable':'Not checked'}"></span>
        <div class="hbody">
          <div class="hshortrow">
            <span class="hshort">${escapeHtml(h.short)}</span>
            ${h.domain ? `<span class="hdomain">${escapeHtml(h.domain)}</span>` : ''}
          </div>
          <span class="hlong">${escapeHtml(h.long)}</span>
          <div class="hmeta">
            ${h.expiresAt ? `<span class="hexpiry">${fmtExpiry(h.expiresAt)}</span>` : ''}
            ${h.copyCount ? `<span class="hcopies">Copied ${h.copyCount}×</span>` : ''}
            ${(h.tags||[]).map(t=>`<span class="htagpill">${escapeHtml(t)}</span>`).join('')}
          </div>
        </div>
        <div class="hactions">
          <button class="hqr" title="QR code">▦</button>
          <button class="hcopy" title="Copy">⧉</button>
          <button class="hshare sharebtn" title="Share">↗</button>
          <button class="hdel" title="Delete">✕</button>
        </div>
      </div>`;
    }).join('');
    if(document.body.classList.contains('no-share')) histList.querySelectorAll('.hshare').forEach(b=>b.style.display='none');
  }

  histList.addEventListener('click', e=>{
    const item = e.target.closest('.hitem'); if(!item) return;
    const id = item.dataset.id, list = loadHistory();
    const idx = list.findIndex(h=>h.id===id);
    if(idx<0) return;
    if(e.target.closest('.hdel')){
      list.splice(idx,1); saveHistory(list); renderHistory();
    } else if(e.target.closest('.hcopy')){
      list[idx].copyCount = (list[idx].copyCount||0)+1; saveHistory(list);
      copyText(list[idx].short, e.target.closest('.hcopy')); renderHistory();
    } else if(e.target.closest('.hqr')){
      toggleInlineQr(item, list[idx].short);
    } else if(e.target.closest('.hshare')){
      navigator.share({ url: list[idx].short, title: 'Snipo short link' }).catch(()=>{});
    }
  });
  function toggleInlineQr(item, url){
    let box = item.parentElement.querySelector('.hist-qr[data-for="'+item.dataset.id+'"]');
    if(box){ box.remove(); return; }
    box = document.createElement('div');
    box.className = 'qrbox show hist-qr'; box.dataset.for = item.dataset.id;
    box.innerHTML = '<div class="qrhold"></div><button class="qrdl">Download PNG</button>';
    item.after(box);
    renderQr(box.querySelector('.qrhold'), url);
    box.querySelector('.qrdl').addEventListener('click', ()=>downloadQr(box.querySelector('.qrhold')));
  }
  clearAll.addEventListener('click', ()=>{
    if(confirm('Clear all saved links from this device?')){ saveHistory([]); activeTag=null; renderHistory(); }
  });

  // ---- Export / Import ----
  function download(filename, content, type){
    const blob = new Blob([content], {type});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }
  exportJsonBtn.addEventListener('click', ()=>{
    download('snipo-history.json', JSON.stringify(loadHistory(), null, 2), 'application/json');
  });
  exportCsvBtn.addEventListener('click', ()=>{
    const rows = [['short','long','domain','tags','created','expires']];
    loadHistory().forEach(h=>rows.push([h.short,h.long,h.domain||'',(h.tags||[]).join('|'),
      new Date(h.ts).toISOString(), h.expiresAt ? new Date(h.expiresAt).toISOString() : '']));
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    download('snipo-history.csv', csv, 'text/csv');
  });
  importFile.addEventListener('change', ()=>{
    const file = importFile.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const incoming = JSON.parse(reader.result);
        if(!Array.isArray(incoming)) throw new Error('bad format');
        const existing = loadHistory();
        const seen = new Set(existing.map(h=>h.short));
        let added = 0;
        incoming.forEach(h=>{
          if(h && h.short && !seen.has(h.short)){
            existing.unshift({
              id: h.id || (Date.now()+Math.random()).toString(36),
              short: h.short, long: h.long||h.short, ts: h.ts||Date.now(),
              expiresAt: h.expiresAt||null, tags: h.tags||[], copyCount: h.copyCount||0,
              domain: h.domain||domainOf(h.long||''), health: 'unknown', lastChecked: null
            });
            seen.add(h.short); added++;
          }
        });
        saveHistory(existing); renderHistory();
        alert(`Imported ${added} link(s).`);
      }catch(e){ alert('Could not read that file — expects a Snipo JSON export.'); }
      importFile.value = '';
    };
    reader.readAsText(file);
  });

  // ---- Link health check ----
  checkHealthBtn.addEventListener('click', async ()=>{
    checkHealthBtn.disabled = true; checkHealthBtn.textContent = 'Checking…';
    const list = loadHistory();
    await Promise.all(list.map(async h=>{
      try{
        await withTimeout(fetch(h.short, {mode:'no-cors'}), 6000);
        h.health = 'ok';
      }catch(e){ h.health = 'dead'; }
      h.lastChecked = Date.now();
    }));
    saveHistory(list); renderHistory();
    checkHealthBtn.disabled = false; checkHealthBtn.textContent = 'Check links';
  });
  function withTimeout(promise, ms){
    return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
  }

  // ---- QR helpers ----
  function renderQr(container, text){
    container.innerHTML = '';
    new QRCode(container, { text, width:160, height:160, colorDark:'#000000', colorLight:'#ffffff' });
  }
  function downloadQr(container){
    const img = container.querySelector('img') || container.querySelector('canvas');
    const src = img.tagName === 'CANVAS' ? img.toDataURL('image/png') : img.src;
    const a = document.createElement('a'); a.href = src; a.download = 'snipo-qr.png'; a.click();
  }
  qrToggleBtn.addEventListener('click', ()=>{
    qrBox.classList.toggle('show');
    if(qrBox.classList.contains('show')) renderQr(qrCanvas, shortOut.textContent);
  });
  qrDownload.addEventListener('click', ()=>downloadQr(qrCanvas));
  shareBtn.addEventListener('click', ()=>{
    navigator.share({ url: shortOut.textContent, title: 'Snipo short link' }).catch(()=>{});
  });

  // ---- Copy helper ----
  function copyText(text, btn){
    navigator.clipboard.writeText(text).then(()=>{
      const old = btn.textContent;
      btn.textContent = '✓'; btn.classList.add('copied');
      setTimeout(()=>{ btn.textContent = old; btn.classList.remove('copied'); }, 1400);
    });
  }
  copyBtn.addEventListener('click', ()=>{
    navigator.clipboard.writeText(shortOut.textContent).then(()=>{
      copyBtn.textContent = 'Copied'; copyBtn.classList.add('copied');
      const list = loadHistory();
      if(list[0] && list[0].short === shortOut.textContent){ list[0].copyCount=(list[0].copyCount||0)+1; saveHistory(list); }
      setTimeout(()=>{ copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 1600);
    });
  });

  // ---- Providers ----
  async function shortenTinyURL(url, customAlias){
    let api = `https://tinyurl.com/api-create.php?url=${encodeURIComponent(url)}`;
    if(customAlias) api += `&alias=${encodeURIComponent(customAlias)}`;
    const res = await fetch(api);
    const text = (await res.text()).trim();
    if(!res.ok || !text.startsWith('http')) throw new Error(text || 'TinyURL failed');
    return text;
  }
  async function shortenIsGd(url, customAlias){
    let api = `https://is.gd/create.php?format=json&url=${encodeURIComponent(url)}`;
    if(customAlias) api += `&shorturl=${encodeURIComponent(customAlias)}`;
    const res = await fetch(api);
    const data = await res.json();
    if(data.errorcode) throw new Error(data.errormessage || 'is.gd failed');
    return data.shorturl;
  }
  async function shortenDaGd(url, customAlias){
    let api = `https://da.gd/shorten?url=${encodeURIComponent(url)}`;
    if(customAlias) api += `&shorturl=${encodeURIComponent(customAlias)}`;
    const res = await fetch(api);
    const text = (await res.text()).trim();
    if(!res.ok || !text.startsWith('http')) throw new Error(text || 'da.gd failed');
    return text;
  }
  async function shortenWithProvider(url, customAlias){
    const pref = providerSel.value;
    const chain = pref==='auto' ? [shortenTinyURL, shortenIsGd, shortenDaGd]
      : pref==='tinyurl' ? [shortenTinyURL] : pref==='isgd' ? [shortenIsGd] : [shortenDaGd];
    let lastErr = null;
    for(const fn of chain){ try{ return await fn(url, customAlias); }catch(e){ lastErr = e; } }
    throw lastErr || new Error('All providers failed');
  }
  function expiryTs(days){ return days > 0 ? Date.now() + days*86400000 : null; }
  function makeId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  // ---- Preview + duplicate detection ----
  let previewAbort = null;
  longUrl.addEventListener('blur', runPreviewAndDupCheck);
  async function runPreviewAndDupCheck(){
    const raw = longUrl.value.trim();
    preview.classList.remove('show'); dupBanner.classList.remove('show'); dupTarget = null;
    if(!isValidUrl(raw)) return;
    const cleaned = stripTrackingParams(raw);
    const key = normKey(cleaned);
    const existing = loadHistory().find(h => normKey(h.long) === key);
    if(existing){
      dupTarget = existing;
      dupShort.textContent = existing.short;
      dupBanner.classList.add('show');
    }
    if(previewAbort) previewAbort.abort();
    previewAbort = new AbortController();
    try{
      const proxied = `https://api.allorigins.win/raw?url=${encodeURIComponent(cleaned)}`;
      const res = await withTimeout(fetch(proxied, { signal: previewAbort.signal }), 5000);
      const html = await res.text();
      const m = html.match(/<title[^>]*>([^<]*)<\/title>/i);
      const title = m ? m[1].trim().slice(0,90) : null;
      if(title){
        previewTitle.textContent = title;
        previewDomain.textContent = domainOf(cleaned);
        preview.classList.add('show');
      }
    }catch(e){ /* best-effort only, fail silently */ }
  }
  dupUse.addEventListener('click', ()=>{
    if(!dupTarget) return;
    shortOut.textContent = dupTarget.short;
    result.classList.add('show');
    dupBanner.classList.remove('show');
  });
  dupIgnore.addEventListener('click', ()=>{ dupBanner.classList.remove('show'); dupTarget = null; });

  // ---- Single shorten ----
  async function handleShorten(){
    const rawUrl = longUrl.value.trim();
    const customAlias = alias.value.trim();
    const tags = tagsInput.value.split(',').map(t=>t.trim()).filter(Boolean);
    err.style.display = 'none'; result.classList.remove('show'); qrBox.classList.remove('show');

    if(!isValidUrl(rawUrl)){
      err.textContent = 'Enter a valid URL starting with http:// or https://';
      err.style.display = 'block';
      return;
    }
    const cleanUrl = stripTrackingParams(rawUrl);
    goBtn.disabled = true; goBtn.textContent = 'Shrinking…';
    let shortLink = null;
    try{ shortLink = await shortenWithProvider(cleanUrl, customAlias); }catch(e){ /* handled below */ }
    goBtn.disabled = false; goBtn.textContent = 'Shorten';

    if(!shortLink){
      err.textContent = 'Could not shorten right now. Check your connection or try a different service in Settings.';
      err.style.display = 'block';
      return;
    }

    shortOut.textContent = shortLink;
    result.classList.remove('show'); void result.offsetWidth; result.classList.add('show');
    chainIcon.style.animation = 'none'; void chainIcon.offsetWidth; chainIcon.style.animation = 'snap .5s ease';

    const list = loadHistory();
    list.unshift({
      id: makeId(), short: shortLink, long: cleanUrl, ts: Date.now(),
      expiresAt: expiryTs(+expirySel.value), tags, copyCount: 0,
      domain: domainOf(cleanUrl), health: 'unknown', lastChecked: null
    });
    saveHistory(list); renderHistory();
    alias.value = ''; tagsInput.value = '';
    dupBanner.classList.remove('show'); preview.classList.remove('show');
  }
  goBtn.addEventListener('click', handleShorten);
  longUrl.addEventListener('keydown', e=>{ if(e.key==='Enter') handleShorten(); });

  // ---- Reset ----
  resetBtn.addEventListener('click', ()=>{
    longUrl.value=''; alias.value=''; tagsInput.value=''; expirySel.value = defaultExpiry.value;
    err.style.display='none'; result.classList.remove('show'); qrBox.classList.remove('show');
    preview.classList.remove('show'); dupBanner.classList.remove('show');
    longUrl.focus();
  });
  bulkResetBtn.addEventListener('click', ()=>{
    bulkText.value=''; bulkErr.style.display='none'; bulkResults.innerHTML=''; bulkText.focus();
  });

  // ---- Bulk shorten ----
  bulkGoBtn.addEventListener('click', async ()=>{
    const lines = bulkText.value.split('\n').map(l=>l.trim()).filter(Boolean);
    bulkErr.style.display = 'none'; bulkResults.innerHTML = '';
    if(!lines.length){
      bulkErr.textContent = 'Paste at least one URL, one per line.';
      bulkErr.style.display = 'block';
      return;
    }
    bulkGoBtn.disabled = true; bulkGoBtn.textContent = `Shrinking 0/${lines.length}…`;
    const list = loadHistory();
    let done = 0;
    for(const line of lines){
      const row = document.createElement('div');
      row.className = 'bres';
      row.innerHTML = `<span class="bshort">${escapeHtml(line)}</span><span class="bstatus">⏳</span>`;
      bulkResults.appendChild(row);

      if(!isValidUrl(line)){
        row.classList.add('err');
        row.querySelector('.bshort').textContent = `Invalid: ${line}`;
        row.querySelector('.bstatus').textContent = '⚠';
      } else {
        const cleaned = stripTrackingParams(line);
        try{
          const short = await shortenWithProvider(cleaned, '');
          row.querySelector('.bshort').textContent = short;
          row.querySelector('.bstatus').textContent = '✓';
          list.unshift({
            id: makeId(), short, long: cleaned, ts: Date.now(),
            expiresAt: expiryTs(+defaultExpiry.value), tags: [], copyCount: 0,
            domain: domainOf(cleaned), health: 'unknown', lastChecked: null
          });
        } catch(e){
          row.classList.add('err');
          row.querySelector('.bshort').textContent = `Failed: ${line}`;
          row.querySelector('.bstatus').textContent = '⚠';
        }
      }
      done++;
      bulkGoBtn.textContent = `Shrinking ${done}/${lines.length}…`;
    }
    saveHistory(list); renderHistory();
    bulkGoBtn.disabled = false; bulkGoBtn.textContent = 'Shorten all';
  });

  renderHistory();

  // ---- Service worker (skipped on localhost previews / claude preview domains) ----
  const previewHostPattern = /localhost|127\.0\.0\.1|claudeusercontent|claude\.site|claude\.ai/i;
  if('serviceWorker' in navigator && !previewHostPattern.test(location.hostname)){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{ /* ignore in unsupported hosting */ });
    });
  }
})();
</script>
</body>
</html>
